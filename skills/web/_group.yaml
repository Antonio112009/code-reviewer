name: Web front-end
description: Browser-facing code in any stack — HTML, JSX/TSX, Vue, Svelte, Angular and server templates, CSS, DOM scripts and service workers, plus code or config that sets browser security headers. Detected by markup/style file types, HTML tags, DOM and browser APIs, browser-framework imports or security-header names.
category: web
priority: 55
detect:
  languages: [html, css, scss, javascript, typescript, vue, svelte, php, text, python, ruby, java, kotlin, csharp, go, rust, yaml, json, toml]
  files:
    - '**/*.{html,htm,vue,svelte,astro,css,scss,sass,less}'
    - '**/*.{hbs,handlebars,ejs,njk,liquid,twig,erb,cshtml,razor,jsp,gohtml}'
    - '**/*.blade.php'
    - '**/_headers'
  content:
    - '<(?:a|article|aside|audio|button|canvas|details|dialog|div|fieldset|figure|footer|form|h[1-6]|header|iframe|img|input|label|li|main|nav|ol|option|p|picture|section|select|span|summary|svg|table|td|textarea|th|tr|ul|video)[\s>/]'
    - '\b(?:document|window|navigator|localStorage|sessionStorage|caches)\.[a-zA-Z]|\bself\.addEventListener\('
    - '(?:\bfrom|\bimport)\s*[''"](?:react-dom|next/|@angular/|vue|nuxt|svelte|@sveltejs/|solid-js|preact|lit|@remix-run/react|react-router|astro|workbox-)'
    - 'Content-Security-Policy|X[-_]Frame[-_]Options|frame-ancestors|Set-Cookie|[Ss]ame[Ss]ite|Access-Control-Allow-|Cross-Origin-(?:Opener|Embedder|Resource)-Policy'
  examples:
    - '<button type="submit">Save</button>'
    - 'document.getElementById("app").focus();'
    - "import { createApp } from 'vue';"
    - "res.setHeader(\"Content-Security-Policy\", \"default-src 'self'\");"
