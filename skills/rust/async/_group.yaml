name: Async Rust (tokio)
description: async/await code on tokio 1.x (tasks, select!, timers, channels, async locks) and the futures crate. Detected when a Rust file uses async fn/.await or tokio/futures APIs.
category: language
priority: 60
detect:
  languages: [rust]
  content: ['\basync\s+(?:fn|move|\{)', '\.await\b', '\btokio::', '#\[tokio::', '\bfutures(?:_util)?::']
  examples:
    - 'async fn fetch_user(id: UserId) -> Result<User, Error> {'
    - 'let user = db.fetch_user(id).await?;'
    - 'let (tx, mut rx) = tokio::sync::mpsc::channel(32);'
    - '#[tokio::main]'
    - 'let joined = futures_util::future::join_all(tasks).await;'
