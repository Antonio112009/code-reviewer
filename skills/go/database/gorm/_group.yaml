name: GORM
description: GORM v2 (gorm.io/gorm 1.25–1.31, including the generics API added in 1.30) and legacy jinzhu/gorm v1 where noted. Detected when the project depends on GORM and the file imports it or uses *gorm.DB.
category: database
detect:
  stack: [orm.gorm]
  content:
    - 'gorm\.io/gorm'
    - 'github\.com/jinzhu/gorm'
    - '\*gorm\.DB\b'
    - '\bgorm\.(?:G|Model|Open|Expr|DeletedAt|Session)\b'
