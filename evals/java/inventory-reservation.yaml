    package com.acme.inventory;

    import jakarta.persistence.Column;
    import jakarta.persistence.Entity;
    import jakarta.persistence.Id;
    import jakarta.persistence.Table;

    @Entity
    @Table(name = "stock_items")
    public class StockItem {
        @Id
        private Long productId;

        @Column(nullable = false)
        private int available;

        @Column(nullable = false)
        private int reserved;

        public Long getProductId() { return productId; }
        public int getAvailable() { return available; }
        public void setAvailable(int available) { this.available = available; }
        public int getReserved() { return reserved; }
        public void setReserved(int reserved) { this.reserved = reserved; }
    }
  src/main/java/com/acme/inventory/StockItemRepository.java: |
    package com.acme.inventory;

    import org.springframework.data.jpa.repository.JpaRepository;
    import org.springframework.data.jpa.repository.Modifying;
    import org.springframework.data.jpa.repository.Query;
    import org.springframework.data.repository.query.Param;

    public interface StockItemRepository extends JpaRepository<StockItem, Long> {
        @Modifying
        @Query("update StockItem s set s.available = s.available - :qty, s.reserved = s.reserved + :qty "
                + "where s.productId = :productId and s.available >= :qty")
        int reserve(@Param("productId") long productId, @Param("qty") int qty);
    }
