    package com.acme.inventory;

    import org.springframework.stereotype.Service;
    import org.springframework.transaction.annotation.Transactional;

    @Service
    public class InventoryService {
        private final StockItemRepository stock;

        public InventoryService(StockItemRepository stock) {
            this.stock = stock;
        }

        @Transactional
        public void reserve(long productId, int quantity) {
            if (quantity <= 0) {
                throw new IllegalArgumentException("quantity must be positive");
            }
            if (stock.reserve(productId, quantity) == 0) {
                throw new OutOfStockException(productId, quantity);
            }
        }
    }
head:
  src/main/java/com/acme/inventory/InventoryService.java: |
    package com.acme.inventory;

    import org.springframework.stereotype.Service;
    import org.springframework.transaction.annotation.Transactional;

    @Service
    public class InventoryService {
        private final StockItemRepository stock;

        public InventoryService(StockItemRepository stock) {
            this.stock = stock;
        }

        @Transactional
        public void reserve(long productId, int quantity) {
            if (quantity <= 0) {
                throw new IllegalArgumentException("quantity must be positive");
            }
            StockItem item = stock.findById(productId)
                    .orElseThrow(() -> new UnknownProductException(productId));
            if (item.getAvailable() < quantity) {
                throw new OutOfStockException(productId, quantity, item.getAvailable());
            }
            item.setAvailable(item.getAvailable() - quantity);
            item.setReserved(item.getReserved() + quantity);
            stock.save(item);
        }
    }
