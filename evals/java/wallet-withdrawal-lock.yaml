    package com.acme.wallet;

    public class InsufficientFundsException extends RuntimeException {
        public InsufficientFundsException(long walletId, long requestedCents) {
            super("wallet " + walletId + " cannot cover a withdrawal of " + requestedCents + " cents");
        }
    }
