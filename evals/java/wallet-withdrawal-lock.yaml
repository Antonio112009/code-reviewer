    package com.acme.wallet;

    import jakarta.persistence.EntityNotFoundException;
    import org.springframework.stereotype.Service;
    import org.springframework.transaction.annotation.Transactional;

    @Service
    public class WalletService {
        private final WalletRepository wallets;
        private final WithdrawalRepository withdrawals;

        public WalletService(WalletRepository wallets, WithdrawalRepository withdrawals) {
            this.wallets = wallets;
            this.withdrawals = withdrawals;
        }

        @Transactional
        public long deposit(long walletId, long amountCents) {
            if (amountCents <= 0) {
                throw new IllegalArgumentException("amount must be positive");
            }
            Wallet wallet = wallets.findByIdForUpdate(walletId)
                    .orElseThrow(() -> new EntityNotFoundException("wallet " + walletId));
            wallet.setBalanceCents(wallet.getBalanceCents() + amountCents);
            return wallet.getBalanceCents();
        }

        @Transactional
        public Withdrawal withdraw(long walletId, long amountCents) {
            if (amountCents <= 0) {
                throw new IllegalArgumentException("amount must be positive");
            }
            Wallet wallet = wallets.findByIdForUpdate(walletId)
                    .orElseThrow(() -> new EntityNotFoundException("wallet " + walletId));
            if (wallet.getBalanceCents() < amountCents) {
                throw new InsufficientFundsException(walletId, amountCents);
            }
            wallet.setBalanceCents(wallet.getBalanceCents() - amountCents);
            return withdrawals.save(new Withdrawal(wallet, amountCents));
        }
    }
