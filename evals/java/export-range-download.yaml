  - file: src/main/java/com/acme/exports/ExportDownloader.java
    lines: 40
    also: [20]
    severity: major
    note: part and PART_SIZE are ints, so part * PART_SIZE overflows before it is widened to long; from 2 GiB on the range start is negative (bytes=-2147483648-...) and every export larger than 2 GiB fails or is written at wrong offsets. Needs (long) part * PART_SIZE
