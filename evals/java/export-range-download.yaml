    package com.acme.exports;

    import java.io.IOException;
    import java.nio.file.Files;
    import java.nio.file.Path;
    import java.nio.file.StandardCopyOption;
    import software.amazon.awssdk.core.sync.ResponseTransformer;
    import software.amazon.awssdk.services.s3.S3Client;

    /** Downloads finished exports (CSV and Parquet, up to tens of gigabytes) from S3. */
    public final class ExportDownloader {
        private final S3Client s3;

        public ExportDownloader(S3Client s3) {
            this.s3 = s3;
        }

        /** Downloads an export object to target, replacing it once the download is complete. */
        public void download(String bucket, String key, Path target) throws IOException {
            Path partial = target.resolveSibling(target.getFileName() + ".part");
            Files.deleteIfExists(partial);
            s3.getObject(b -> b.bucket(bucket).key(key), ResponseTransformer.toFile(partial));
            Files.move(partial, target, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);
        }
    }
