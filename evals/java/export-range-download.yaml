  src/main/java/com/acme/exports/ExportDownloader.java: |
    package com.acme.exports;

    import java.io.IOException;
    import java.nio.ByteBuffer;
    import java.nio.channels.FileChannel;
    import java.nio.file.Files;
    import java.nio.file.Path;
    import java.nio.file.StandardCopyOption;
    import java.nio.file.StandardOpenOption;
    import java.util.ArrayList;
    import java.util.List;
    import java.util.concurrent.ExecutionException;
    import java.util.concurrent.ExecutorService;
    import java.util.concurrent.Future;
    import software.amazon.awssdk.services.s3.S3Client;
    import software.amazon.awssdk.services.s3.model.HeadObjectResponse;

    /** Downloads finished exports (CSV and Parquet, up to tens of gigabytes) from S3 in parallel byte ranges. */
    public final class ExportDownloader {
        static final int PART_SIZE = 16 * 1024 * 1024;

        private final S3Client s3;
        private final ExecutorService pool;

        public ExportDownloader(S3Client s3, ExecutorService pool) {
            this.s3 = s3;
            this.pool = pool;
        }

        /** Downloads an export object to target, replacing it once the download is complete. */
        public void download(String bucket, String key, Path target) throws IOException, InterruptedException {
            HeadObjectResponse head = s3.headObject(b -> b.bucket(bucket).key(key));
            long size = head.contentLength();
            int parts = (int) ((size + PART_SIZE - 1) / PART_SIZE);
            Path partial = target.resolveSibling(target.getFileName() + ".part");
            List<Future<?>> pending = new ArrayList<>(parts);
            try (FileChannel out = FileChannel.open(partial, StandardOpenOption.CREATE, StandardOpenOption.WRITE,
                    StandardOpenOption.TRUNCATE_EXISTING)) {
                for (int part = 0; part < parts; part++) {
                    long start = part * PART_SIZE;
                    long end = Math.min(start + PART_SIZE, size) - 1;
                    pending.add(pool.submit(() -> {
                        writeRange(out, bucket, key, head.eTag(), start, end);
                        return null;
                    }));
                }
                for (Future<?> f : pending) {
                    f.get();
                }
            } catch (ExecutionException e) {
                pending.forEach(f -> f.cancel(true));
                throw new IOException("download of s3://" + bucket + "/" + key + " failed", e.getCause());
            }
            Files.move(partial, target, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);
        }

        private void writeRange(FileChannel out, String bucket, String key, String eTag, long start, long end)
                throws IOException {
            ByteBuffer bytes = s3.getObjectAsBytes(b -> b.bucket(bucket).key(key).ifMatch(eTag)
                    .range("bytes=" + start + "-" + end)).asByteBuffer();
            long position = start;
            while (bytes.hasRemaining()) {
                position += out.write(bytes, position);
            }
        }
    }
