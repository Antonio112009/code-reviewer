    import { query, queryOne } from '../db.js';
    import type { Workspace } from '../types.js';

    const COLUMNS = 'id, name, join_domain AS "joinDomain", created_at AS "createdAt"';

    /** Creates a workspace with `ownerId` as its owner, in one statement. */
    export async function createWorkspace(name: string, ownerId: string): Promise<Workspace> {
      const workspace = await queryOne<Workspace>(
        `WITH o AS (
           INSERT INTO orgs (name) VALUES ($1) RETURNING *
         ), m AS (
           INSERT INTO org_members (org_id, user_id, role) SELECT o.id, $2, 'owner' FROM o
         )
         SELECT ${COLUMNS} FROM o`,
        [name, ownerId],
      );
      return workspace!;
    }

    export async function findWorkspace(workspaceId: string): Promise<Workspace | undefined> {
      return queryOne<Workspace>(`SELECT ${COLUMNS} FROM orgs WHERE id = $1`, [workspaceId]);
    }

    export async function renameWorkspace(workspaceId: string, name: string): Promise<Workspace | undefined> {
      return queryOne<Workspace>(`UPDATE orgs SET name = $2 WHERE id = $1 RETURNING ${COLUMNS}`, [workspaceId, name]);
    }

    export async function listWorkspacesForUser(userId: string): Promise<Workspace[]> {
      return query<Workspace>(
        `SELECT o.id, o.name, o.join_domain AS "joinDomain", o.created_at AS "createdAt"
           FROM orgs o
           JOIN org_members m ON m.org_id = o.id
          WHERE m.user_id = $1
          ORDER BY o.name`,
        [userId],
      );
    }
  src/repositories/members.ts: |
    import { query, queryOne } from '../db.js';
    import type { Membership, Role } from '../types.js';

    const COLUMNS = 'org_id AS "workspaceId", user_id AS "userId", role, joined_at AS "joinedAt"';

    /** Adds a member; an existing membership is returned unchanged. */
    export async function addMember(workspaceId: string, userId: string, role: Role): Promise<Membership> {
      const membership = await queryOne<Membership>(
        `INSERT INTO org_members (org_id, user_id, role)
         VALUES ($1, $2, $3)
         ON CONFLICT (org_id, user_id) DO UPDATE SET role = org_members.role
         RETURNING ${COLUMNS}`,
        [workspaceId, userId, role],
      );
      return membership!;
    }

    export async function findMembership(workspaceId: string, userId: string): Promise<Membership | undefined> {
      return queryOne<Membership>(`SELECT ${COLUMNS} FROM org_members WHERE org_id = $1 AND user_id = $2`, [
        workspaceId,
        userId,
      ]);
    }

    export async function listMembers(workspaceId: string): Promise<Membership[]> {
      return query<Membership>(`SELECT ${COLUMNS} FROM org_members WHERE org_id = $1 ORDER BY joined_at`, [workspaceId]);
    }

    export async function updateRole(workspaceId: string, userId: string, role: Role): Promise<Membership | undefined> {
      return queryOne<Membership>(
        `UPDATE org_members SET role = $3 WHERE org_id = $1 AND user_id = $2 RETURNING ${COLUMNS}`,
        [workspaceId, userId, role],
      );
    }

    export async function removeMember(workspaceId: string, userId: string): Promise<boolean> {
      const rows = await query(`DELETE FROM org_members WHERE org_id = $1 AND user_id = $2 RETURNING user_id`, [
        workspaceId,
        userId,
      ]);
      return rows.length > 0;
    }
