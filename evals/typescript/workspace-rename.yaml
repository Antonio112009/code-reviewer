    import express from 'express';
    import { authenticate } from './auth/session.js';
    import { errorHandler } from './errors.js';
    import { loadWorkspace } from './middleware/workspace.js';
    import { inviteAcceptance, workspaceInvites } from './routes/invites.js';
    import members from './routes/members.js';
    import workspaces from './routes/workspaces.js';

    export const app = express();

    app.use(express.json({ limit: '100kb' }));
    app.use(authenticate);
    app.use('/workspaces', workspaces);
    app.use('/workspaces/:workspaceId/members', loadWorkspace, members);
    app.use('/workspaces/:workspaceId/invites', loadWorkspace, workspaceInvites);
    app.use('/invites', inviteAcceptance);
    app.use(errorHandler);
  test/helpers.ts: |
    import { randomUUID } from 'node:crypto';
    import { issueSessionToken } from '../src/auth/session.js';
    import { pool, queryOne } from '../src/db.js';
    import type { AuthUser } from '../src/types.js';

    export async function resetDatabase(): Promise<void> {
      await pool.query('TRUNCATE invites, org_members, orgs, users CASCADE');
    }

    export async function createUser(email: string, opts: { emailVerified?: boolean } = {}): Promise<AuthUser> {
      const user = await queryOne<AuthUser>(
        `INSERT INTO users (id, email, email_verified) VALUES ($1, $2, $3)
         RETURNING id, email, email_verified AS "emailVerified"`,
        [randomUUID(), email, opts.emailVerified ?? false],
      );
      return user!;
    }

    export async function setJoinDomain(workspaceId: string, domain: string): Promise<void> {
      await pool.query('UPDATE orgs SET join_domain = $2 WHERE id = $1', [workspaceId, domain]);
    }

    export function signIn(user: AuthUser): Record<string, string> {
      return { authorization: `Bearer ${issueSessionToken(user.id)}` };
    }
  test/members.test.ts: |
    import { afterAll, beforeEach, describe, expect, it } from 'vitest';
    import { pool } from '../src/db.js';
    import { addMember, findMembership, listMembers, removeMember, updateRole } from '../src/repositories/members.js';
    import { createWorkspace } from '../src/repositories/workspaces.js';
    import { createUser, resetDatabase } from './helpers.js';

    describe('members repository', () => {
      beforeEach(resetDatabase);
      afterAll(() => pool.end());

      it('makes the creator the owner of a new workspace', async () => {
        const owner = await createUser('owner@example.com');
        const workspace = await createWorkspace('Acme', owner.id);
        expect(await findMembership(workspace.id, owner.id)).toMatchObject({ workspaceId: workspace.id, userId: owner.id, role: 'owner' });
      });

      it('adds a member once and keeps the first role', async () => {
        const owner = await createUser('owner@example.com');
        const user = await createUser('dev@example.com');
        const workspace = await createWorkspace('Acme', owner.id);
        await addMember(workspace.id, user.id, 'member');
        const again = await addMember(workspace.id, user.id, 'admin');
        expect(again).toMatchObject({ workspaceId: workspace.id, userId: user.id, role: 'member' });
        expect(await listMembers(workspace.id)).toHaveLength(2);
      });

      it('updates and removes members', async () => {
        const owner = await createUser('owner@example.com');
        const user = await createUser('dev@example.com');
        const workspace = await createWorkspace('Acme', owner.id);
        await addMember(workspace.id, user.id, 'viewer');
        expect(await updateRole(workspace.id, user.id, 'admin')).toMatchObject({ role: 'admin' });
        expect(await removeMember(workspace.id, user.id)).toBe(true);
        expect(await findMembership(workspace.id, user.id)).toBeUndefined();
      });
    });
