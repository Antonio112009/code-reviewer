    import type { NextFunction, Request, Response } from 'express';
    import { HttpError } from '../errors.js';
    import { findMembership } from '../repositories/members.js';
    import { findWorkspace } from '../repositories/workspaces.js';

    /** Loads req.workspace from the :workspaceId parameter; callers who are not members get a 404. */
    export async function loadWorkspace(req: Request, _res: Response, next: NextFunction): Promise<void> {
      try {
        const workspace = await findWorkspace(req.params.workspaceId!);
        const membership = workspace && (await findMembership(workspace.id, req.user.id));
        if (!workspace || !membership) throw new HttpError(404, 'Workspace not found');
        req.workspace = workspace;
        req.membership = membership;
        next();
      } catch (err) {
        next(err);
      }
    }
  src/routes/workspaces.ts: |
    import { Router } from 'express';
    import { requireRole } from '../auth/roles.js';
    import { HttpError } from '../errors.js';
    import { loadWorkspace } from '../middleware/workspace.js';
    import { addMember } from '../repositories/members.js';
    import { createWorkspace, findWorkspace, listWorkspacesForUser, renameWorkspace } from '../repositories/workspaces.js';
    import { parseName } from '../validation.js';

    const router = Router();

    router.get('/', async (req, res, next) => {
      try {
        res.json(await listWorkspacesForUser(req.user.id));
      } catch (err) {
        next(err);
      }
    });

    router.post('/', async (req, res, next) => {
      try {
        const workspace = await createWorkspace(parseName(req.body.name), req.user.id);
        res.status(201).json(workspace);
      } catch (err) {
        next(err);
      }
    });

    router.get('/:workspaceId', loadWorkspace, (req, res) => {
      res.json({ ...req.workspace, role: req.membership!.role });
    });

    router.patch('/:workspaceId', loadWorkspace, requireRole('admin'), async (req, res, next) => {
      try {
        res.json(await renameWorkspace(req.workspace!.id, parseName(req.body.name)));
      } catch (err) {
        next(err);
      }
    });

    // Users with a verified address at the workspace's domain may join it without an invite.
    router.post('/:workspaceId/join', async (req, res, next) => {
      try {
        const workspace = await findWorkspace(req.params.workspaceId);
        const domain = req.user.email.split('@').pop()?.toLowerCase();
        if (!workspace?.joinDomain || !req.user.emailVerified || domain !== workspace.joinDomain) {
          throw new HttpError(404, 'Workspace not found');
        }
        const membership = await addMember(workspace.id, req.user.id, 'member');
        res.status(201).json(membership);
      } catch (err) {
        next(err);
      }
    });

    export default router;
  src/routes/members.ts: |
    import { Router } from 'express';
    import { atLeast, outranks, requireRole } from '../auth/roles.js';
    import { HttpError } from '../errors.js';
    import { findMembership, listMembers, removeMember, updateRole } from '../repositories/members.js';
    import { parseRole } from '../validation.js';

    const router = Router({ mergeParams: true });

    router.get('/', async (req, res, next) => {
      try {
        res.json(await listMembers(req.workspace!.id));
      } catch (err) {
        next(err);
      }
    });

    router.patch('/:userId', requireRole('admin'), async (req, res, next) => {
      try {
        const role = parseRole(req.body.role);
        const target = await findMembership(req.workspace!.id, req.params.userId!);
        if (!target) throw new HttpError(404, 'Member not found');
        const actor = req.membership!.role;
        if (role === 'owner' || !atLeast(actor, role) || !outranks(actor, target.role)) {
          throw new HttpError(403, 'You cannot change this member to this role');
        }
        res.json(await updateRole(req.workspace!.id, target.userId, role));
      } catch (err) {
        next(err);
      }
    });

    router.delete('/:userId', async (req, res, next) => {
      try {
        const target = await findMembership(req.workspace!.id, req.params.userId!);
        if (!target) throw new HttpError(404, 'Member not found');
        const actor = req.membership!.role;
        const leaving = target.userId === req.user.id;
        if (leaving && target.role === 'owner') {
          throw new HttpError(409, 'Transfer ownership before leaving the workspace');
        }
        if (!leaving && !(atLeast(actor, 'admin') && outranks(actor, target.role))) {
          throw new HttpError(403, 'Forbidden');
        }
        await removeMember(req.workspace!.id, target.userId);
        res.status(204).end();
      } catch (err) {
        next(err);
      }
    });

    export default router;
  src/routes/invites.ts: |
    import { Router } from 'express';
    import { atLeast, requireRole } from '../auth/roles.js';
    import { HttpError } from '../errors.js';
    import { sendInviteEmail } from '../mail.js';
    import {
      createInvite,
      findPendingInvite,
      listPendingInvites,
      markAccepted,
      revokeInvite,
    } from '../repositories/invites.js';
    import { addMember } from '../repositories/members.js';
    import { parseEmail, parseRole } from '../validation.js';

    /** The invites of a workspace, mounted under /workspaces/:workspaceId/invites. */
    export const workspaceInvites = Router({ mergeParams: true });

    workspaceInvites.get('/', requireRole('admin'), async (req, res, next) => {
      try {
        res.json(await listPendingInvites(req.workspace!.id));
      } catch (err) {
        next(err);
      }
    });

    workspaceInvites.post('/', requireRole('admin'), async (req, res, next) => {
      try {
        const email = parseEmail(req.body.email);
        const role = parseRole(req.body.role ?? 'member');
        if (role === 'owner' || !atLeast(req.membership!.role, role)) {
          throw new HttpError(403, 'You cannot invite members with this role');
        }
        const { invite, token } = await createInvite(req.workspace!.id, email, role, req.user.id);
        await sendInviteEmail(email, req.workspace!.name, token);
        res.status(201).json(invite);
      } catch (err) {
        next(err);
      }
    });

    workspaceInvites.delete('/:inviteId', requireRole('admin'), async (req, res, next) => {
      try {
        if (!(await revokeInvite(req.workspace!.id, req.params.inviteId!))) throw new HttpError(404, 'Invite not found');
        res.status(204).end();
      } catch (err) {
        next(err);
      }
    });

    /** Accepting an invite, mounted under /invites: the invitee is not a member yet. */
    export const inviteAcceptance = Router();

    inviteAcceptance.post('/accept', async (req, res, next) => {
      try {
        if (typeof req.body.token !== 'string') throw new HttpError(400, 'token is required');
        const invite = await findPendingInvite(req.body.token);
        if (!invite) throw new HttpError(404, 'Invite not found or expired');
        if (!req.user.emailVerified || invite.email !== req.user.email.toLowerCase()) {
          throw new HttpError(403, 'This invite was sent to a different e-mail address');
        }
        const membership = await addMember(req.user.id, invite.workspaceId, invite.role);
        await markAccepted(invite.id);
        res.json(membership);
      } catch (err) {
        next(err);
      }
    });
