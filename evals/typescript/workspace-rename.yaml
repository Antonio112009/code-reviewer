    import { createHash, randomBytes } from 'node:crypto';
    import { query, queryOne } from '../db.js';
    import type { Invite, Role } from '../types.js';

    const COLUMNS = `id, org_id AS "workspaceId", email, role, invited_by AS "invitedBy",
      expires_at AS "expiresAt", accepted_at AS "acceptedAt"`;

    function hashToken(token: string): string {
      return createHash('sha256').update(token).digest('hex');
    }

    /** Creates an invite valid for 7 days; the token is only returned here, the database keeps its hash. */
    export async function createInvite(
      workspaceId: string,
      email: string,
      role: Role,
      invitedBy: string,
    ): Promise<{ invite: Invite; token: string }> {
      const token = randomBytes(32).toString('base64url');
      const invite = await queryOne<Invite>(
        `INSERT INTO invites (org_id, email, role, token_hash, invited_by, expires_at)
         VALUES ($1, $2, $3, $4, $5, now() + interval '7 days')
         RETURNING ${COLUMNS}`,
        [workspaceId, email, role, hashToken(token), invitedBy],
      );
      return { invite: invite!, token };
    }

    export async function findPendingInvite(token: string): Promise<Invite | undefined> {
      return queryOne<Invite>(
        `SELECT ${COLUMNS} FROM invites
          WHERE token_hash = $1 AND accepted_at IS NULL AND expires_at > now()`,
        [hashToken(token)],
      );
    }

    export async function listPendingInvites(workspaceId: string): Promise<Invite[]> {
      return query<Invite>(
        `SELECT ${COLUMNS} FROM invites
          WHERE org_id = $1 AND accepted_at IS NULL AND expires_at > now()
          ORDER BY expires_at`,
        [workspaceId],
      );
    }

    export async function markAccepted(inviteId: string): Promise<void> {
      await query('UPDATE invites SET accepted_at = now() WHERE id = $1 AND accepted_at IS NULL', [inviteId]);
    }

    export async function revokeInvite(workspaceId: string, inviteId: string): Promise<boolean> {
      const rows = await query('DELETE FROM invites WHERE org_id = $1 AND id = $2 AND accepted_at IS NULL RETURNING id', [
        workspaceId,
        inviteId,
      ]);
      return rows.length > 0;
    }
