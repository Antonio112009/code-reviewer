    import request from 'supertest';
    import { beforeEach, describe, expect, it } from 'vitest';
    import { app } from '../src/app.js';
    import { createUser, resetDatabase, setJoinDomain, signIn } from './helpers.js';

    describe('workspaces API', () => {
      beforeEach(resetDatabase);

      it('creates a workspace owned by the caller', async () => {
        const owner = await createUser('owner@example.com');
        const created = await request(app).post('/workspaces').set(signIn(owner)).send({ name: 'Acme' }).expect(201);
        const workspace = await request(app).get(`/workspaces/${created.body.id}`).set(signIn(owner)).expect(200);
        expect(workspace.body).toMatchObject({ name: 'Acme', role: 'owner' });
      });

      it('hides workspaces from non-members', async () => {
        const owner = await createUser('owner@example.com');
        const stranger = await createUser('stranger@example.com');
        const created = await request(app).post('/workspaces').set(signIn(owner)).send({ name: 'Acme' }).expect(201);
        await request(app).get(`/workspaces/${created.body.id}`).set(signIn(stranger)).expect(404);
        await request(app).get(`/workspaces/${created.body.id}/members`).set(signIn(stranger)).expect(404);
      });

      it('lets verified users at the join domain join as members', async () => {
        const owner = await createUser('owner@acme.test');
        const colleague = await createUser('dev@acme.test', { emailVerified: true });
        const outsider = await createUser('dev@other.test', { emailVerified: true });
        const created = await request(app).post('/workspaces').set(signIn(owner)).send({ name: 'Acme' }).expect(201);
        await setJoinDomain(created.body.id, 'acme.test');
        await request(app).post(`/workspaces/${created.body.id}/join`).set(signIn(outsider)).expect(404);
        const joined = await request(app).post(`/workspaces/${created.body.id}/join`).set(signIn(colleague)).expect(201);
        expect(joined.body).toMatchObject({ workspaceId: created.body.id, userId: colleague.id, role: 'member' });
      });

      it('only lets admins rename a workspace', async () => {
        const owner = await createUser('owner@acme.test');
        const colleague = await createUser('dev@acme.test', { emailVerified: true });
        const created = await request(app).post('/workspaces').set(signIn(owner)).send({ name: 'Acme' }).expect(201);
        await setJoinDomain(created.body.id, 'acme.test');
        await request(app).post(`/workspaces/${created.body.id}/join`).set(signIn(colleague)).expect(201);
        await request(app).patch(`/workspaces/${created.body.id}`).set(signIn(colleague)).send({ name: 'Mine' }).expect(403);
        const renamed = await request(app).patch(`/workspaces/${created.body.id}`).set(signIn(owner)).send({ name: 'Acme Inc' });
        expect(renamed.body).toMatchObject({ id: created.body.id, name: 'Acme Inc' });
      });
    });
