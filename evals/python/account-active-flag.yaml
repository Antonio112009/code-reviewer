    from functools import wraps

    from flask import Blueprint, abort, request, session
    from sqlalchemy import select
    from werkzeug.security import check_password_hash, generate_password_hash

    from .db import db_session
    from .models import Account

    bp = Blueprint("auth", __name__)

    # Compared against when the e-mail is unknown, so both failures take as long.
    _UNKNOWN_ACCOUNT_HASH = generate_password_hash("unknown account")


    @bp.post("/login")
    def login():
        payload = request.get_json(silent=True) or {}
        email = str(payload.get("email", "")).strip().lower()
        password = str(payload.get("password", ""))
        account = db_session.scalars(select(Account).where(Account.email == email)).one_or_none()
        if not check_password_hash(account.password_hash if account else _UNKNOWN_ACCOUNT_HASH, password) or not account:
            abort(401, "invalid e-mail or password")
        if account.disabled:
            abort(403, "this account has been disabled")
        session.clear()
        session["account_id"] = account.id
        return {"id": account.id, "name": account.name}


    @bp.post("/logout")
    def logout():
        session.clear()
        return "", 204


    def current_account() -> Account:
        """The signed-in account; disabled accounts lose their sessions on the next request."""
        account_id = session.get("account_id")
        account = db_session.get(Account, account_id) if account_id else None
        if account is None or account.disabled:
            session.clear()
            abort(401)
        return account


    def require_admin(view):
        @wraps(view)
        def wrapper(*args, **kwargs):
            if not current_account().is_admin:
                abort(403)
            return view(*args, **kwargs)

        return wrapper
