  app/accounts/lifecycle.py: |
    """Deactivating, reactivating and finally purging accounts."""

    import logging
    from datetime import UTC, datetime, timedelta

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from ..models import Account

    logger = logging.getLogger(__name__)

    RETENTION = timedelta(days=90)


    def deactivate(account: Account, now: datetime) -> bool:
        """Deactivates the account and revokes its API tokens; its sessions end on their next request.

        Returns False when the account was already inactive.
        """
        if not account.active:
            return False
        account.active = False
        account.deactivated_at = now
        for token in account.tokens:
            if token.revoked_at is None:
                token.revoked_at = now
        return True


    def reactivate(account: Account) -> bool:
        """Reactivates the account; revoked API tokens stay revoked. Returns False when it was already active."""
        if account.active:
            return False
        account.active = True
        account.deactivated_at = None
        return True


    def purge_inactive_accounts(session: Session, now: datetime | None = None) -> int:
        """Deletes accounts (and their tokens) that have been inactive for longer than the retention period."""
        cutoff = (now or datetime.now(UTC)) - RETENTION
        accounts = session.scalars(
            select(Account).where(Account.active.is_(False), Account.deactivated_at < cutoff).order_by(Account.id)
        ).all()
        for account in accounts:
            session.delete(account)
        session.commit()
        logger.info("purged %d accounts deactivated before %s", len(accounts), cutoff.date())
        return len(accounts)
