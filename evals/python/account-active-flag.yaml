    from app.db import db_session
    from app.models import Account


    def test_disable_revokes_tokens(admin_client, make_account, make_token):
        ann = make_account("ann@example.com")
        make_token(ann)
        resp = admin_client.post(f"/admin/accounts/{ann.id}/disable")
        assert resp.status_code == 200
        assert resp.json["disabled"] is True
        assert resp.json["disabled_at"] is not None
        db_session.refresh(ann)
        assert all(token.revoked_at is not None for token in ann.tokens)


    def test_enable_restores_the_account(admin_client, make_account):
        ann = make_account("ann@example.com", disabled=True)
        resp = admin_client.post(f"/admin/accounts/{ann.id}/enable")
        assert resp.json["disabled"] is False
        assert db_session.get(Account, ann.id).disabled_at is None


    def test_list_filters_by_status(admin_client, make_account):
        make_account("ann@example.com")
        make_account("bob@example.com", disabled=True)
        disabled = admin_client.get("/admin/accounts?status=disabled").json["accounts"]
        enabled = admin_client.get("/admin/accounts?status=enabled").json["accounts"]
        assert [a["email"] for a in disabled] == ["bob@example.com"]
        assert [a["email"] for a in enabled] == ["root@example.com", "ann@example.com"]


    def test_non_admins_cannot_disable_accounts(client, make_account):
        ann = make_account("ann@example.com", "correct horse")
        bob = make_account("bob@example.com")
        client.post("/login", json={"email": "ann@example.com", "password": "correct horse"})
        assert client.post(f"/admin/accounts/{bob.id}/disable").status_code == 403
        assert db_session.get(Account, bob.id).disabled is False
        assert ann.disabled is False
