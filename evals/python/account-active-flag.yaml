    from datetime import UTC, datetime, timedelta

    from app.db import db_session
    from app.jobs.cleanup import purge_disabled_accounts
    from app.models import Account


    def test_purges_accounts_disabled_before_the_retention_period(app, make_account):
        now = datetime(2026, 6, 1, tzinfo=UTC)
        old = make_account("old@example.com", disabled=True)
        recent = make_account("recent@example.com", disabled=True)
        active = make_account("active@example.com")
        old.disabled_at = now - timedelta(days=91)
        recent.disabled_at = now - timedelta(days=10)
        db_session.commit()

        assert purge_disabled_accounts(db_session, now) == 1

        remaining = {a.email for a in db_session.query(Account)}
        assert remaining == {"recent@example.com", "active@example.com"}
        assert active.disabled is False
  web/admin/AccountsPage.tsx: |
    import { useState } from 'react';
    import useSWR from 'swr';
    import { api } from '../api';
    import { formatDate } from '../format';

    type StatusFilter = 'all' | 'enabled' | 'disabled';

    interface AdminAccount {
      id: number;
      email: string;
      name: string;
      plan: string;
      disabled: boolean;
      disabled_at: string | null;
    }

    export function AccountsPage() {
      const [status, setStatus] = useState<StatusFilter>('all');
      const query = status === 'all' ? '' : `?status=${status}`;
      const { data, mutate } = useSWR<{ accounts: AdminAccount[] }>(`/admin/accounts${query}`, api.get);

      async function toggle(account: AdminAccount) {
        const action = account.disabled ? 'enable' : 'disable';
        if (action === 'disable' && !window.confirm(`Disable ${account.email}? Their API tokens are revoked.`)) return;
        await api.post(`/admin/accounts/${account.id}/${action}`);
        await mutate();
      }

      return (
        <section>
          <h1>Accounts</h1>
          <select value={status} onChange={(e) => setStatus(e.target.value as StatusFilter)}>
            <option value="all">All</option>
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
          </select>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>E-mail</th>
                <th>Plan</th>
                <th>Status</th>
                <th />
              </tr>
            </thead>
            <tbody>
              {data?.accounts.map((account) => (
                <tr key={account.id} className={account.disabled ? 'muted' : undefined}>
                  <td>{account.name}</td>
                  <td>{account.email}</td>
                  <td>{account.plan}</td>
                  <td>{account.disabled ? `Disabled on ${formatDate(account.disabled_at)}` : 'Enabled'}</td>
                  <td>
                    <button type="button" onClick={() => toggle(account)}>
                      {account.disabled ? 'Enable' : 'Disable'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      );
    }
