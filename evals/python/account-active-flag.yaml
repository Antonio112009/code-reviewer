    import enum
    from datetime import date, datetime

    from sqlalchemy import Boolean, Date, DateTime, Enum, ForeignKey, String, func
    from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship


    class Base(DeclarativeBase):
        pass


    class Plan(enum.StrEnum):
        FREE = "free"
        TEAM = "team"
        BUSINESS = "business"


    class Account(Base):
        __tablename__ = "accounts"

        id: Mapped[int] = mapped_column(primary_key=True)
        email: Mapped[str] = mapped_column(String(254), unique=True)
        name: Mapped[str] = mapped_column(String(200))
        password_hash: Mapped[str] = mapped_column(String(200))
        is_admin: Mapped[bool] = mapped_column(Boolean, default=False, server_default="false")
        plan: Mapped[Plan] = mapped_column(Enum(Plan, native_enum=False), default=Plan.FREE)
        renews_on: Mapped[date | None] = mapped_column(Date)
        disabled: Mapped[bool] = mapped_column(Boolean, default=False, server_default="false")
        disabled_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True))
        created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())

        tokens: Mapped[list["ApiToken"]] = relationship(back_populates="account", cascade="all, delete-orphan")


    class ApiToken(Base):
        __tablename__ = "api_tokens"

        id: Mapped[int] = mapped_column(primary_key=True)
        account_id: Mapped[int] = mapped_column(ForeignKey("accounts.id"))
        token_hash: Mapped[str] = mapped_column(String(64), unique=True)
        revoked_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True))

        account: Mapped[Account] = relationship(back_populates="tokens")
