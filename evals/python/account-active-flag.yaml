  CHANGELOG.md: |
    # Changelog

    ## 2.0.0

    - Accounts are "active" or "deactivated" instead of "enabled" or "disabled". The admin API follows: the
      `disabled` and `disabled_at` fields are now `active` and `deactivated_at`, `status=enabled|disabled` is
      `status=active|inactive`, and `/disable` and `/enable` are `/deactivate` and `/reactivate`. The admin
      page ships with the same release.

    ## 1.8.0

    - API tokens are stored as SHA-256 hashes; existing tokens keep working.
    - Weekly digest e-mails skip accounts without activity.
