    import { useState } from 'react';
    import useSWR from 'swr';
    import { api } from '../api';
    import { formatDate } from '../format';

    type StatusFilter = 'all' | 'active' | 'inactive';

    interface AdminAccount {
      id: number;
      email: string;
      name: string;
      plan: string;
      active: boolean;
      deactivated_at: string | null;
    }

    export function AccountsPage() {
      const [status, setStatus] = useState<StatusFilter>('all');
      const query = status === 'all' ? '' : `?status=${status}`;
      const { data, mutate } = useSWR<{ accounts: AdminAccount[] }>(`/admin/accounts${query}`, api.get);

      async function toggle(account: AdminAccount) {
        const action = account.active ? 'deactivate' : 'reactivate';
        if (action === 'deactivate' && !window.confirm(`Deactivate ${account.email}? Their API tokens are revoked.`)) {
          return;
        }
        await api.post(`/admin/accounts/${account.id}/${action}`);
        await mutate();
      }

      return (
        <section>
          <h1>Accounts</h1>
          <select value={status} onChange={(e) => setStatus(e.target.value as StatusFilter)}>
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="inactive">Deactivated</option>
          </select>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>E-mail</th>
                <th>Plan</th>
                <th>Status</th>
                <th />
              </tr>
            </thead>
            <tbody>
              {data?.accounts.map((account) => (
                <tr key={account.id} className={account.active ? undefined : 'muted'}>
                  <td>{account.name}</td>
                  <td>{account.email}</td>
                  <td>{account.plan}</td>
                  <td>{account.active ? 'Active' : `Deactivated on ${formatDate(account.deactivated_at)}`}</td>
                  <td>
                    <button type="button" onClick={() => toggle(account)}>
                      {account.active ? 'Deactivate' : 'Reactivate'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      );
    }
