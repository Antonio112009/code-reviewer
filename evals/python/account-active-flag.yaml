    def test_login_starts_a_session(client, make_account):
        make_account("ann@example.com", "correct horse")
        resp = client.post("/login", json={"email": "Ann@Example.com", "password": "correct horse"})
        assert resp.status_code == 200
        assert resp.json["name"] == "Ann"


    def test_wrong_password_is_rejected(client, make_account):
        make_account("ann@example.com", "correct horse")
        resp = client.post("/login", json={"email": "ann@example.com", "password": "battery staple"})
        assert resp.status_code == 401


    def test_disabled_account_cannot_log_in(client, make_account):
        make_account("ann@example.com", "correct horse", disabled=True)
        resp = client.post("/login", json={"email": "ann@example.com", "password": "correct horse"})
        assert resp.status_code == 403


    def test_disabled_account_loses_its_session(admin_client, make_account):
        ann = make_account("ann@example.com", "correct horse")
        with admin_client.application.test_client() as ann_client:
            ann_client.post("/login", json={"email": "ann@example.com", "password": "correct horse"})
            assert ann_client.get("/me").status_code == 200
            admin_client.post(f"/admin/accounts/{ann.id}/disable")
            assert ann_client.get("/me").status_code == 401


    def test_api_token_of_disabled_account_is_rejected(client, make_account, make_token):
        ann = make_account("ann@example.com", "correct horse", disabled=True)
        token = make_token(ann)
        resp = client.get("/api/v1/projects", headers={"Authorization": f"Bearer {token}"})
        assert resp.status_code == 401


    def test_api_token_of_enabled_account_is_accepted(client, make_account, make_token):
        ann = make_account("ann@example.com", "correct horse")
        token = make_token(ann)
        resp = client.get("/api/v1/projects", headers={"Authorization": f"Bearer {token}"})
        assert resp.status_code == 200
