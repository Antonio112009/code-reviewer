    from datetime import UTC, datetime

    from flask import Blueprint, abort, request
    from sqlalchemy import select

    from ..auth import require_admin
    from ..db import db_session
    from ..models import Account
    from ..serializers import account_to_dict

    bp = Blueprint("admin_accounts", __name__, url_prefix="/admin/accounts")

    PAGE_SIZE = 50


    @bp.get("")
    @require_admin
    def list_accounts():
        query = select(Account).order_by(Account.id)
        status = request.args.get("status")
        if status == "disabled":
            query = query.where(Account.disabled.is_(True))
        elif status == "enabled":
            query = query.where(Account.disabled.is_(False))
        elif status is not None:
            abort(400, "status must be enabled or disabled")
        page = max(request.args.get("page", 1, type=int), 1)
        accounts = db_session.scalars(query.limit(PAGE_SIZE).offset((page - 1) * PAGE_SIZE)).all()
        return {"accounts": [account_to_dict(a) for a in accounts], "page": page}


    @bp.post("/<int:account_id>/disable")
    @require_admin
    def disable_account(account_id: int):
        account = db_session.get(Account, account_id) or abort(404)
        if not account.disabled:
            now = datetime.now(UTC)
            account.disabled = True
            account.disabled_at = now
            for token in account.tokens:
                if token.revoked_at is None:
                    token.revoked_at = now
            db_session.commit()
        return account_to_dict(account)


    @bp.post("/<int:account_id>/enable")
    @require_admin
    def enable_account(account_id: int):
        account = db_session.get(Account, account_id) or abort(404)
        if account.disabled:
            account.disabled = False
            account.disabled_at = None
            db_session.commit()
        return account_to_dict(account)
  app/jobs/billing.py: |
    import logging
    from datetime import date

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from ..models import Account, Plan
    from ..tasks import charge_renewal

    logger = logging.getLogger(__name__)


    def accounts_due_for_renewal(session: Session, today: date) -> list[Account]:
        """Accounts on a paid plan whose billing period ends today or earlier."""
        stmt = (
            select(Account)
            .where(Account.disabled.is_(False))
            .where(Account.plan != Plan.FREE)
            .where(Account.renews_on <= today)
            .order_by(Account.id)
        )
        return list(session.scalars(stmt))


    def run_renewals(session: Session, today: date | None = None) -> int:
        """Queues one renewal charge per due account; charge_renewal is idempotent per account and period."""
        today = today or date.today()
        accounts = accounts_due_for_renewal(session, today)
        for account in accounts:
            charge_renewal.delay(account.id, account.renews_on.isoformat())
        logger.info("queued %d renewals for %s", len(accounts), today)
        return len(accounts)
  app/jobs/cleanup.py: |
    import logging
    from datetime import UTC, datetime, timedelta

    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from ..models import Account

    logger = logging.getLogger(__name__)

    RETENTION = timedelta(days=90)


    def purge_disabled_accounts(session: Session, now: datetime | None = None) -> int:
        """Deletes accounts (and their tokens) that have been disabled for longer than the retention period."""
        cutoff = (now or datetime.now(UTC)) - RETENTION
        accounts = session.scalars(
            select(Account).where(Account.disabled.is_(True), Account.disabled_at < cutoff).order_by(Account.id)
        ).all()
        for account in accounts:
            session.delete(account)
        session.commit()
        logger.info("purged %d accounts disabled before %s", len(accounts), cutoff.date())
        return len(accounts)
  app/notifications/digest.py: |
    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from ..mail import send_template
    from ..models import Account
    from .activity import weekly_activity


    def digest_recipients(session: Session) -> list[Account]:
        return list(session.scalars(select(Account).where(Account.disabled.is_(False)).order_by(Account.id)))


    def send_weekly_digest(session: Session) -> int:
        sent = 0
        for account in digest_recipients(session):
            activity = weekly_activity(session, account.id)
            if activity.is_empty():
                continue
            send_template(account.email, "weekly-digest", {"name": account.name, "activity": activity.summary()})
            sent += 1
        return sent
