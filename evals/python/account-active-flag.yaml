    from datetime import UTC, datetime, timedelta

    from app.accounts.lifecycle import deactivate, purge_inactive_accounts, reactivate
    from app.db import db_session
    from app.models import Account

    NOW = datetime(2026, 6, 1, tzinfo=UTC)


    def test_deactivate_revokes_open_tokens_only(app, make_account, make_token):
        ann = make_account("ann@example.com")
        make_token(ann)
        make_token(ann)
        earlier = NOW - timedelta(days=3)
        ann.tokens[0].revoked_at = earlier

        assert deactivate(ann, NOW) is True

        assert ann.active is False
        assert ann.deactivated_at == NOW
        assert [t.revoked_at for t in ann.tokens] == [earlier, NOW]


    def test_deactivate_twice_keeps_the_first_date(app, make_account):
        ann = make_account("ann@example.com")
        deactivate(ann, NOW)
        assert deactivate(ann, NOW + timedelta(days=1)) is False
        assert ann.deactivated_at == NOW


    def test_reactivate_clears_the_date(app, make_account):
        ann = make_account("ann@example.com", active=False)
        assert reactivate(ann) is True
        assert ann.active is True
        assert ann.deactivated_at is None
        assert reactivate(ann) is False


    def test_purges_accounts_inactive_for_longer_than_the_retention_period(app, make_account):
        old = make_account("old@example.com", active=False)
        recent = make_account("recent@example.com", active=False)
        active = make_account("active@example.com")
        old.deactivated_at = NOW - timedelta(days=91)
        recent.deactivated_at = NOW - timedelta(days=10)
        db_session.commit()

        assert purge_inactive_accounts(db_session, NOW) == 1

        remaining = {a.email for a in db_session.query(Account)}
        assert remaining == {"recent@example.com", "active@example.com"}
        assert active.active is True
