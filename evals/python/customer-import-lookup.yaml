    @cli.command("import-customers")
    @click.argument("path", type=click.Path(exists=True, dir_okay=False))
    def import_customers_command(path: str) -> None:
        from shop.customers.importer import import_customers

        with open(path, newline="", encoding="utf-8-sig") as source, session_scope() as session:
            result = import_customers(session, source)
        click.echo(f"created {result.created}, updated {result.updated}, skipped {result.skipped}")
