head:
  shop/customers/importer.py: |
    import csv
    from dataclasses import dataclass
    from typing import IO

    from sqlalchemy.orm import Session

    from .models import Customer
    from .repository import CustomerRepository


    @dataclass
    class ImportResult:
        created: int = 0
        updated: int = 0
        skipped: int = 0


    def import_customers(session: Session, source: IO[str]) -> ImportResult:
        """Creates or updates customers from a CRM export with the columns email, name, marketing_opt_in."""
        customers = CustomerRepository(session)
        result = ImportResult()
        for row in csv.DictReader(source):
            email = (row.get("email") or "").strip()
            if not email:
                result.skipped += 1
                continue
            name = (row.get("name") or "").strip()
            opt_in = (row.get("marketing_opt_in") or "").strip().lower() in {"1", "true", "yes"}
            customer = customers.get_by_email(email)
            if customer is None:
                customers.add(Customer(email=email, name=name, marketing_opt_in=opt_in))
                result.created += 1
            else:
                customer.name = name or customer.name
                customer.marketing_opt_in = opt_in
                result.updated += 1
        return result
