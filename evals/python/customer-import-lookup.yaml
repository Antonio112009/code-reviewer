    from datetime import datetime

    from sqlalchemy import DateTime, String, func
    from sqlalchemy.orm import Mapped, mapped_column

    from shop.db import Base


    class Customer(Base):
        __tablename__ = "customers"

        id: Mapped[int] = mapped_column(primary_key=True)
        email: Mapped[str] = mapped_column(String(254), unique=True)
        name: Mapped[str] = mapped_column(String(200))
        marketing_opt_in: Mapped[bool] = mapped_column(default=False)
        created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())
  shop/customers/repository.py: |
    from sqlalchemy import select
    from sqlalchemy.orm import Session

    from .models import Customer


    class CustomerNotFound(LookupError):
        pass


    def normalize_email(email: str) -> str:
        return email.strip().lower()


    class CustomerRepository:
        def __init__(self, session: Session) -> None:
            self._session = session

        def get(self, customer_id: int) -> Customer:
            customer = self._session.get(Customer, customer_id)
            if customer is None:
                raise CustomerNotFound(customer_id)
            return customer

        def get_by_email(self, email: str) -> Customer:
            stmt = select(Customer).where(Customer.email == normalize_email(email))
            customer = self._session.scalars(stmt).one_or_none()
            if customer is None:
                raise CustomerNotFound(email)
            return customer

        def add(self, customer: Customer) -> Customer:
            customer.email = normalize_email(customer.email)
            self._session.add(customer)
            self._session.flush()
            return customer
