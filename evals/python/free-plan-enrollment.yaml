    from accounts.models import Account

    from .models import Plan
    from .services import active_subscription


    def current_plan(account: Account) -> Plan:
        return active_subscription(account).plan


    def can_create_project(account: Account) -> bool:
        plan = current_plan(account)
        return plan.max_projects is None or account.projects.count() < plan.max_projects
