  billing/services.py: |
    from django.db import IntegrityError, transaction
    from django.utils import timezone

    from accounts.models import Account

    from .models import Plan, Subscription

    FREE_PLAN_CODE = "free"


    def cancel_subscription(subscription: Subscription) -> None:
        subscription.status = Subscription.Status.CANCELLED
        subscription.cancelled_at = timezone.now()
        subscription.save(update_fields=["status", "cancelled_at"])


    def active_subscription(account: Account) -> Subscription:
        """The account's active subscription; an account without one is enrolled on the free plan."""
        active = Subscription.objects.select_related("plan").filter(account=account, status=Subscription.Status.ACTIVE)
        subscription = active.first()
        if subscription is not None:
            return subscription
        free_plan = Plan.objects.get(code=FREE_PLAN_CODE)
        try:
            with transaction.atomic():
                return Subscription.objects.create(account=account, plan=free_plan)
        except IntegrityError:
            # A concurrent request enrolled the account first; one_active_subscription_per_account
            # guarantees that its subscription is the only active one.
            return active.get()
