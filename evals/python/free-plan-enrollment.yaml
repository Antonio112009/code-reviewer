    from django.db import models
    from django.db.models import Q
    from django.utils import timezone


    class Plan(models.Model):
        code = models.SlugField(unique=True)
        name = models.CharField(max_length=100)
        monthly_price_cents = models.PositiveIntegerField()
        max_projects = models.PositiveIntegerField(null=True, blank=True)


    class Subscription(models.Model):
        class Status(models.TextChoices):
            ACTIVE = "active"
            CANCELLED = "cancelled"

        account = models.ForeignKey("accounts.Account", on_delete=models.CASCADE, related_name="subscriptions")
        plan = models.ForeignKey(Plan, on_delete=models.PROTECT)
        status = models.CharField(max_length=16, choices=Status.choices, default=Status.ACTIVE)
        started_at = models.DateTimeField(default=timezone.now)
        cancelled_at = models.DateTimeField(null=True, blank=True)

        class Meta:
            constraints = [
                models.UniqueConstraint(
                    fields=["account"],
                    condition=Q(status="active"),
                    name="one_active_subscription_per_account",
                ),
            ]
