    import logging

    import stripe
    from celery import shared_task
    from django.db import transaction

    from .models import Order
    from .notifications import send_receipt

    logger = logging.getLogger(__name__)


    @shared_task(bind=True, max_retries=5, default_retry_delay=60)
    def capture_payment(self, order_id):
        with transaction.atomic():
            order = Order.objects.select_for_update().get(pk=order_id)
            if order.status != Order.Status.AUTHORIZED:
                logger.info("order %s is %s, nothing to capture", order_id, order.status)
                return
            try:
                stripe.PaymentIntent.capture(order.payment_intent_id)
            except stripe.error.APIConnectionError as exc:
                raise self.retry(exc=exc)
            order.status = Order.Status.PAID
            order.save(update_fields=["status", "updated_at"])
        send_receipt.delay(order_id)
