head:
  shop/views.py: |
    import csv

    from django.contrib.auth.decorators import login_required
    from django.core.paginator import Paginator
    from django.http import HttpResponse
    from django.shortcuts import render

    from .models import Order


    @login_required
    def order_list(request):
        orders = (
            Order.objects.filter(shop=request.user.shop)
            .select_related("customer")
            .order_by("-created_at")
        )
        page = Paginator(orders, 50).get_page(request.GET.get("page"))
        return render(request, "shop/order_list.html", {"page": page})


    @login_required
    def export_orders(request):
        orders = Order.objects.filter(shop=request.user.shop).order_by("-created_at")
        response = HttpResponse(content_type="text/csv")
        response["Content-Disposition"] = 'attachment; filename="orders.csv"'
        writer = csv.writer(response)
        writer.writerow(["number", "created_at", "customer", "email", "items", "total"])
        for order in orders:
            writer.writerow(
                [
                    order.number,
                    order.created_at.isoformat(),
                    order.customer.full_name,
                    order.customer.email,
                    order.items.count(),
                    order.total,
                ]
            )
        return response
  shop/urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("orders/", views.order_list, name="order-list"),
        path("orders/export.csv", views.export_orders, name="order-export"),
    ]
