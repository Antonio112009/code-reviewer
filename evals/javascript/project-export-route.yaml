title: Project export route named its parameter so the router's membership check never runs
tags: [javascript, express, security, cross-file, hard]
base:
  package.json: |
    {
      "name": "projects-api",
      "private": true,
      "dependencies": {
        "bullmq": "^5.34.0",
        "express": "^4.21.2",
        "lodash": "^4.17.21",
        "sequelize": "^6.37.5"
      }
    }
  src/app.js: |
    const express = require('express');
    const { requireAuth } = require('./middleware/auth');
    const { errorHandler } = require('./middleware/errors');
    const projects = require('./routes/projects');

    const app = express();
    app.use(express.json({ limit: '100kb' }));
    app.use('/api', requireAuth, projects);
    app.use(errorHandler);

    module.exports = app;
  src/middleware/roles.js: |
    const { HttpError } = require('../errors');

    const RANK = { viewer: 1, editor: 2, owner: 3 };

    function requireRole(role) {
      return (req, res, next) => {
        if (!req.membership || RANK[req.membership.role] < RANK[role]) {
          return next(new HttpError(403, 'Forbidden'));
        }
        next();
      };
    }

    module.exports = { requireRole };
  src/routes/projects/router.js: |
    const express = require('express');
    const { HttpError } = require('../../errors');
    const { Project } = require('../../models');

    const router = express.Router();

    // Loads the project of every /projects/:projectId route and checks that the caller is a member.
    router.param('projectId', async (req, res, next, projectId) => {
      try {
        const project = await Project.findOne({ where: { id: projectId, deletedAt: null } });
        const membership = project && (await project.getMembership(req.user.id));
        if (!membership) throw new HttpError(404, 'Project not found');
        req.project = project;
        req.membership = membership;
        next();
      } catch (err) {
        next(err);
      }
    });

    module.exports = router;
  src/routes/projects/index.js: |
    const { pick } = require('lodash');
    const { requireRole } = require('../../middleware/roles');
    const router = require('./router');

    router.get('/projects/:projectId', (req, res) => {
      res.json(req.project.toJSON());
    });

    router.patch('/projects/:projectId', requireRole('editor'), async (req, res, next) => {
      try {
        await req.project.update(pick(req.body, ['name', 'description']));
        res.json(req.project.toJSON());
      } catch (err) {
        next(err);
      }
    });

    router.delete('/projects/:projectId', requireRole('owner'), async (req, res, next) => {
      try {
        await req.project.update({ deletedAt: new Date() });
        res.status(204).end();
      } catch (err) {
        next(err);
      }
    });

    module.exports = router;
head:
  src/routes/projects/index.js: |
    const { pick } = require('lodash');
    const { HttpError } = require('../../errors');
    const { exportQueue } = require('../../jobs/queues');
    const { requireRole } = require('../../middleware/roles');
    const { Project } = require('../../models');
    const router = require('./router');

    const EXPORT_FORMATS = new Set(['csv', 'json']);

    router.get('/projects/:projectId', (req, res) => {
      res.json(req.project.toJSON());
    });

    router.patch('/projects/:projectId', requireRole('editor'), async (req, res, next) => {
      try {
        await req.project.update(pick(req.body, ['name', 'description']));
        res.json(req.project.toJSON());
      } catch (err) {
        next(err);
      }
    });

    router.delete('/projects/:projectId', requireRole('owner'), async (req, res, next) => {
      try {
        await req.project.update({ deletedAt: new Date() });
        res.status(204).end();
      } catch (err) {
        next(err);
      }
    });

    router.post('/projects/:id/export', async (req, res, next) => {
      try {
        const format = req.body.format ?? 'csv';
        if (!EXPORT_FORMATS.has(format)) throw new HttpError(400, 'Unsupported export format');
        const project = await Project.findOne({ where: { id: req.params.id, deletedAt: null } });
        if (!project) throw new HttpError(404, 'Project not found');
        const job = await exportQueue.add('project-export', {
          projectId: project.id,
          format,
          recipient: req.user.email,
        });
        res.status(202).json({ jobId: job.id });
      } catch (err) {
        next(err);
      }
    });

    module.exports = router;
expect:
  - file: src/routes/projects/index.js
    lines: [32, 36]
    severity: major
    note: the membership check is a router.param('projectId') hook; the new route uses :id, so it never runs and any signed-in user can export any project (sent to their own e-mail) by guessing or enumerating ids
